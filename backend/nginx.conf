# ==============================================================================
# Echo Backend - Nginx Reverse Proxy Configuration Template
# ==============================================================================
# Use this configuration when deploying the backend on Server A behind Nginx.
# Provides TLS termination, rate limiting, and 110MB client upload size limit.
# ==============================================================================

# Rate limiting zones (10 uploads per minute per IP, 60 requests/s general API)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=api_uploads:10m rate=10r/m;

upstream echo_backend_upstream {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com; # Replace with your backend domain or IP

    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    # Maximum payload size for media uploads (must be >= backend multer limit of 100MB)
    client_max_body_size 110m;

    # Gzip compression for API responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/plain text/css;

    # Static uploads with long cache headers
    location /uploads/ {
        proxy_pass http://echo_backend_upstream/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Upload endpoint with rate limiting
    location /api/media/upload {
        limit_req zone=api_uploads burst=5 nodelay;

        proxy_pass http://echo_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Standard API endpoints
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;

        proxy_pass http://echo_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catch-all
    location / {
        proxy_pass http://echo_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

