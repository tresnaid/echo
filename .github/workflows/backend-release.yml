name: Deploy Backend to Production VPS

on:
  push:
    tags:
      - 'v[0-9]*-be'

jobs:
  test-and-build:
    name: Test & Build Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate backend release tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Checking tag format for: '${TAG}'"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-be$ ]]; then
            echo "::error::Invalid backend release tag '${TAG}'. Must strictly match '^v[0-9]+\.[0-9]+\.[0-9]+-be$' (e.g. v1.0.0-be, v2.1.0-be)."
            exit 1
          fi
          echo "Backend release tag '${TAG}' is valid."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'backend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Type check backend
        working-directory: ./backend
        run: pnpm run typecheck

      - name: Run backend tests
        working-directory: ./backend
        run: pnpm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      ENVHUB_SERVER: https://env.tresnaid.space
      ENVHUB_CLI_VERSION: "0.2.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy with EnvHub-managed VPS access
        shell: bash
        run: |
          set -euo pipefail

          # Exchange GitHub's signed OIDC assertion for a five-minute EnvHub
          # token. No persistent EnvHub credential is stored in GitHub.
          assertion="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=envhub" | jq -er .value)"
          token="$(curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer ${assertion}" \
            "${ENVHUB_SERVER}/v1/auth/github-actions/exchange" | jq -er .access_token)"
          echo "::add-mask::${token}"

          # Fetch deployment transport values without printing them. Temporary
          # files disappear with the runner even if the job is interrupted.
          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT
          secrets_file="${work_dir}/envhub-secrets.json"
          key_file="${work_dir}/deploy-key"
          known_hosts_file="${work_dir}/known-hosts"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" \
            "${ENVHUB_SERVER}/v1/runtime/secrets" > "${secrets_file}"
          chmod 0600 "${secrets_file}"

          if ! jq -e \
            '.project == "echo-backend" and .environment == "production"' \
            "${secrets_file}" >/dev/null; then
            echo "::error::EnvHub token is not scoped to echo-backend/production."
            exit 1
          fi

          for name in VPS_HOST VPS_USER VPS_PORT VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            if ! jq -e --arg name "${name}" \
              '(.secrets[$name] // "") | strings | select(length > 0)' \
              "${secrets_file}" >/dev/null; then
              echo "::error::EnvHub secret ${name} is required in echo-backend/production."
              exit 1
            fi
          done

          vps_host="$(jq -er '.secrets.VPS_HOST' "${secrets_file}")"
          vps_user="$(jq -er '.secrets.VPS_USER' "${secrets_file}")"
          vps_port="$(jq -er '.secrets.VPS_PORT' "${secrets_file}")"
          jq -er '.secrets.VPS_SSH_PRIVATE_KEY' "${secrets_file}" > "${key_file}"
          jq -er '.secrets.VPS_SSH_KNOWN_HOSTS' "${secrets_file}" > "${known_hosts_file}"
          chmod 0600 "${key_file}" "${known_hosts_file}"

          if [[ ! "${vps_host}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::VPS_HOST contains invalid characters."
            exit 1
          fi
          if [[ ! "${vps_user}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::VPS_USER contains invalid characters."
            exit 1
          fi
          if [[ ! "${vps_port}" =~ ^[0-9]+$ ]] ||
             (( vps_port < 1 || vps_port > 65535 )); then
            echo "::error::VPS_PORT must be an integer from 1 to 65535."
            exit 1
          fi
          if ! ssh-keygen -y -P '' -f "${key_file}" >/dev/null; then
            echo "::error::VPS_SSH_PRIVATE_KEY must be a valid, unencrypted private key."
            exit 1
          fi
          if ! ssh-keygen -l -f "${known_hosts_file}" >/dev/null; then
            echo "::error::VPS_SSH_KNOWN_HOSTS is not a valid known_hosts entry."
            exit 1
          fi
          rm -f "${secrets_file}"

          ssh_options=(
            -i "${key_file}"
            -o "Port=${vps_port}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts_file}"
          )

          echo "==> Synchronizing compose.prod.yml to the VPS..."
          scp "${ssh_options[@]}" \
            compose.prod.yml \
            "${vps_user}@${vps_host}:/srv/apps/echo/compose.prod.yml"

          echo "==> Starting Echo backend deployment for ${GITHUB_REF_NAME}..."
          remote_bootstrap='set -eu
          IFS= read -r TAG
          IFS= read -r ENVHUB_SERVER
          IFS= read -r ENVHUB_CLI_VERSION
          IFS= read -r ENVHUB_TOKEN
          export TAG ENVHUB_SERVER ENVHUB_CLI_VERSION ENVHUB_TOKEN
          exec sh -s'
          {
            printf '%s\n' \
              "${GITHUB_REF_NAME}" \
              "${ENVHUB_SERVER}" \
              "${ENVHUB_CLI_VERSION}" \
              "${token}"
            cat <<'REMOTE_SCRIPT'
          set -eu
          APP_DIR="/srv/apps/echo"

          mkdir -p "${APP_DIR}/data/uploads"
          cd "${APP_DIR}"

          if ! command -v envhub >/dev/null 2>&1; then
            echo "envhub CLI is not installed on the VPS. See docs/ENVHUB_MIGRATION.md." >&2
            exit 1
          fi
          if [ "$(envhub version)" != "envhub ${ENVHUB_CLI_VERSION}" ]; then
            echo "Expected envhub ${ENVHUB_CLI_VERSION} on the VPS; found $(envhub version)." >&2
            exit 1
          fi
          if [ ! -f "${APP_DIR}/compose.prod.yml" ]; then
            echo "compose.prod.yml synchronization failed; file missing in ${APP_DIR}." >&2
            exit 1
          fi

          cp "${APP_DIR}/compose.prod.yml" "${APP_DIR}/compose.yml"
          echo "==> Synchronized repository compose.prod.yml to ${APP_DIR}/compose.yml"

          envhub run --server "${ENVHUB_SERVER}" -- sh -eu -c '
            release_version="$1"
            unset ENVHUB_TOKEN ENVHUB_SERVER
            unset VPS_HOST VPS_USER VPS_PORT
            unset VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS
            export ECHO_VERSION="${release_version}"

            echo "==> Validating Docker Compose configuration..."
            docker compose --env-file /dev/null config >/dev/null

            echo "==> Pulling backend image for ${ECHO_VERSION}..."
            docker compose --env-file /dev/null pull backend

            echo "==> Recreating backend container..."
            docker compose --env-file /dev/null up -d backend

            echo "==> Verifying backend health..."
            HEALTHY=0
            for i in $(seq 1 15); do
              HEALTH_RESPONSE=$(curl -s -f http://127.0.0.1:3001/api/health || true)
              if echo "${HEALTH_RESPONSE}" | grep -q "\"status\":\"ok\""; then
                echo "==> Backend is healthy!"
                HEALTHY=1
                break
              fi
              echo "Waiting for backend to become healthy (attempt $i/15)..."
              sleep 2
            done

            if [ "${HEALTHY}" -ne 1 ]; then
              echo "Backend health check failed after 30 seconds!" >&2
              docker compose --env-file /dev/null logs --tail=50 backend
              exit 1
            fi
          ' sh "${TAG}"

          unset ENVHUB_TOKEN
          echo "==> Deployment completed successfully for version ${TAG}"
          REMOTE_SCRIPT
          } | ssh "${ssh_options[@]}" \
            "${vps_user}@${vps_host}" \
            "${remote_bootstrap}"
