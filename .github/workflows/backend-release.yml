name: Deploy Backend to Production VPS

on:
  push:
    tags:
      - 'v[0-9]*-be'

jobs:
  test-and-build:
    name: Test & Build Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate backend release tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Checking tag format for: '${TAG}'"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-be$ ]]; then
            echo "::error::Invalid backend release tag '${TAG}'. Must strictly match '^v[0-9]+\.[0-9]+\.[0-9]+-be$' (e.g. v1.0.0-be, v2.1.0-be)."
            exit 1
          fi
          echo "Backend release tag '${TAG}' is valid."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'backend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Type check backend
        working-directory: ./backend
        run: pnpm run typecheck

      - name: Run backend tests
        working-directory: ./backend
        run: pnpm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      ENVHUB_SERVER: https://env.tresnaid.space
      ENVHUB_CLI_VERSION: "0.2.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Synchronize compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "compose.prod.yml"
          target: "/srv/apps/echo"

      - name: Exchange GitHub identity for a short-lived EnvHub token
        id: envhub
        shell: bash
        run: |
          set -euo pipefail
          assertion="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=envhub" | jq -er .value)"
          token="$(curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer ${assertion}" \
            "${ENVHUB_SERVER}/v1/auth/github-actions/exchange" | jq -er .access_token)"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENVHUB_TOKEN: ${{ steps.envhub.outputs.token }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_REF_NAME,ENVHUB_SERVER,ENVHUB_CLI_VERSION,ENVHUB_TOKEN
          script: |
            set -eu
            APP_DIR="/srv/apps/echo"
            TAG="${GITHUB_REF_NAME}"

            echo "==> Starting Echo backend deployment for version: ${TAG}"

            # Ensure persistent uploads directory exists.
            mkdir -p "${APP_DIR}/data/uploads"
            cd "${APP_DIR}"

            # Step 1: Require the pinned EnvHub CLI installed during migration.
            if ! command -v envhub >/dev/null 2>&1; then
              echo "::error::envhub CLI is not installed on the VPS. See docs/ENVHUB_MIGRATION.md."
              exit 1
            fi
            if [ "$(envhub version)" != "envhub ${ENVHUB_CLI_VERSION}" ]; then
              echo "::error::Expected envhub ${ENVHUB_CLI_VERSION} on the VPS; found $(envhub version)."
              exit 1
            fi

            # Step 2: Ensure compose.prod.yml was synchronized and update compose.yml.
            if [ ! -f "${APP_DIR}/compose.prod.yml" ]; then
              echo "::error::compose.prod.yml synchronization failed; file missing in ${APP_DIR}."
              exit 1
            fi
            cp "${APP_DIR}/compose.prod.yml" "${APP_DIR}/compose.yml"
            echo "==> Synchronized repository compose.prod.yml to ${APP_DIR}/compose.yml"

            # Step 3: Fetch runtime configuration into this process only. Docker
            # Compose is explicitly prevented from reading a legacy .env file.
            envhub run --server "${ENVHUB_SERVER}" -- sh -eu -c '
              release_version="$1"
              unset ENVHUB_TOKEN ENVHUB_SERVER
              export ECHO_VERSION="${release_version}"

              echo "==> Validating Docker Compose configuration..."
              docker compose --env-file /dev/null config >/dev/null

              echo "==> Pulling backend image for ${ECHO_VERSION}..."
              docker compose --env-file /dev/null pull backend

              echo "==> Recreating backend container..."
              docker compose --env-file /dev/null up -d backend

              echo "==> Verifying backend health..."
              HEALTHY=0
              for i in $(seq 1 15); do
                HEALTH_RESPONSE=$(curl -s -f http://127.0.0.1:3001/api/health || true)
                if echo "${HEALTH_RESPONSE}" | grep -q "\"status\":\"ok\""; then
                  echo "==> Backend is healthy!"
                  HEALTHY=1
                  break
                fi
                echo "Waiting for backend to become healthy (attempt $i/15)..."
                sleep 2
              done

              if [ "${HEALTHY}" -ne 1 ]; then
                echo "::error::Backend health check failed after 30 seconds!"
                docker compose --env-file /dev/null logs --tail=50 backend
                exit 1
              fi
            ' sh "${TAG}"

            echo "==> Deployment completed successfully for version ${TAG}"
