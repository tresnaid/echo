services:
  # ----------------------------------------------------------------------------
  # Unified Fullstack Service (Default: serves both UI & API on port 3001)
  # ----------------------------------------------------------------------------
  echo:
    build:
      context: .
      target: unified
    container_name: echo-app
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/echo.db
      - UPLOADS_PATH=/app/data/uploads
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Backend API Only (used when running frontend & backend in separate containers)
  # To run: docker compose --profile separate up
  # ----------------------------------------------------------------------------
  backend:
    profiles: ["separate"]
    build:
      context: .
      target: backend
    container_name: echo-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/echo.db
      - UPLOADS_PATH=/app/data/uploads
      - CORS_ORIGIN=http://localhost:5173,http://localhost:8080,http://localhost
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Frontend Only (Nginx SPA container)
  # To run: docker compose --profile separate up
  # ----------------------------------------------------------------------------
  frontend:
    profiles: ["separate"]
    build:
      context: .
      target: frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
    container_name: echo-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
