services:
  # ----------------------------------------------------------------------------
  # Backend API Service (Express + SQLite + media uploads on port 3001)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echo-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/echo.db
      - UPLOADS_PATH=/app/data/uploads
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080,http://localhost:3000,http://localhost}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Frontend Web Service (React SPA served via Nginx on port 5173)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
    container_name: echo-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
